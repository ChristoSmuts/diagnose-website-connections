<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connection Diagnostics — is it the site, or your internet?</title>
    <meta
      name="description"
      content="Check any website and find out plainly whether a slowdown is the site's server, your own internet connection, or the network path between them."
    />

    <!--
      Set the theme before first paint.

      Without this the page renders light and then flips to dark, which is a
      jarring flash for anyone using a dark theme. Inline and synchronous on
      purpose — a deferred script would be too late.
    -->
    <script>
      try {
        var stored = localStorage.getItem('dwc-theme');
        if (stored === 'dark' || stored === 'light') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) {
        /* Private browsing can block storage; the media query still applies. */
      }
    </script>

    <!-- Tells the browser to render native form controls and scrollbars to match. -->
    <meta name="color-scheme" content="light dark" />

    <!--
      The SVG is the real icon — it follows the browser theme, which a raster
      cannot. The .ico is the fallback for browsers that will not load an SVG
      favicon, and it is requested from the root by name whether it is linked or
      not: without the file, that request fell through to the SPA handler and came
      back as HTML with a 200.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Tints browser chrome on mobile. Two values, because one of them is wrong
         against the other theme's background. -->
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10131a" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <dwc-app></dwc-app>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
