packages:
  - apps/*
  - packages/*
  - e2e

# better-sqlite3 ships a native addon, and its build is deliberately refused.
#
# Refused explicitly rather than by omission: pnpm 11 treats an undeclared build
# script as an error (ERR_PNPM_IGNORED_BUILDS) and exits 1, so "false" is how you
# say no.
#
# It has no `install` script but does have a `binding.gyp`, so approving it for
# builds makes pnpm fall back to the implicit `node-gyp rebuild` — compiling from
# source on every install, on every machine. That needs make and a C++ toolchain,
# which `ubuntu-latest` happens to have and the Playwright container used by the
# e2e job does not, so CI failed there and only there with "not found: make".
#
# Nothing was gained by the compile in the first place: prebuilds ship for every
# platform this project targets, `lib/binding.js` falls back to
# `prebuilds/<target>.node` when no `build/Release` exists, and that is the path
# already in use. The Dockerfile still installs a toolchain, which stays useful
# for an architecture with no prebuild.
allowBuilds:
  better-sqlite3: false
  # Build-time only, pulled in by the Tailwind CLI. Never shipped at runtime,
  # so these add no burden to a self-hosted deployment.
  '@parcel/watcher': true
  rs-module-lexer: true
  # Native module resolver used by eslint-plugin-import-x. Lint-time only.
  unrs-resolver: true

# Single source of truth for dependency versions across every workspace package.
# Packages reference these as "catalog:" so versions can never drift apart.
catalog:
  # Language / build
  typescript: ^7.0.2
  vite: ^8.2.1
  turbo: ^2.10.10

  # UI
  lit: ^3.3.3
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  '@tailwindcss/cli': ^4.3.3

  # Server
  fastify: ^5.12.0
  '@fastify/cors': ^11.1.0
  '@fastify/helmet': ^13.1.0
  '@fastify/rate-limit': ^11.2.0
  '@fastify/static': ^10.1.3
  pino: ^10.3.1
  pino-pretty: ^13.1.3

  # Data
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  better-sqlite3: ^13.0.3
  '@types/better-sqlite3': ^9.6.0

  # Validation
  zod: ^4.4.3

  # Test
  vitest: ^4.1.10
  '@vitest/browser': ^4.1.10
  '@playwright/test': ^1.62.1
  '@axe-core/playwright': ^4.13.0
  axe-core: ^4.13.0

  # Types — pinned to the 24.x line to match the Node 24 LTS runtime.
  # Deliberately NOT "latest" (26.x), which would type against APIs the runtime lacks.
  '@types/node': ^24.13.3
