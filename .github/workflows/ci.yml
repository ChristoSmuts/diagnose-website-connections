name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Regenerating visual baselines is a manual act. They must be produced in the
  # same container CI compares against — font rasterisation differs by platform,
  # so a baseline taken on a developer machine can never match.
  #
  # This job is the option for anyone without Docker. With it,
  # ./scripts/update-visual-baselines.sh does the same work locally in the same
  # image, and skips the artifact round trip.
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate visual baselines and upload them as an artifact'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: everything that needs no browser and no network.
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Pinned to the same major as .nvmrc. Local and CI drifting apart is a
          # common source of TLS and DNS differences in exactly this kind of app.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ordered fastest-failing first, and each one is a real gate.
      - name: Formatting
        run: pnpm run format:check

      # Before lint, not after, and that ordering is load-bearing.
      #
      # The lint rules are type-aware, and every workspace package publishes its
      # types from `dist`. On a clean checkout there is no `dist`, so
      # typescript-eslint cannot resolve `@dwc/contracts` or `@dwc/diagnostics`
      # and reports every use of them as an unresolved-type error — dozens of
      # them, none real, all pointing at innocent lines. It passed locally only
      # because a previous build had left `dist` behind.
      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit and integration tests
        run: pnpm run test

      # The probe engine is useless if it cannot actually reach the internet, so
      # CI runs a real diagnostic against a known-good host. It also catches
      # environment-specific breakage that fixtures never would.
      - name: Smoke test the probe engine against a live site
        run: node apps/api/src/cli/probe.ts example.com --json > /tmp/probe.json

      - name: Assert the smoke test produced a usable verdict
        run: |
          node -e "
            const r = require('/tmp/probe.json');
            if (r.verdict.culprit === 'unreachable') throw new Error('probe could not reach the target');
            if (typeof r.verdict.score !== 'number') throw new Error('no score produced');
            if (!Array.isArray(r.verdict.checks) || r.verdict.checks.length < 10) {
              throw new Error('expected a full set of checks, got ' + (r.verdict.checks || []).length);
            }
            console.log('verdict:', r.verdict.culprit, r.verdict.score + '/100,', r.verdict.checks.length, 'checks');
          "

  # Browser-driven gates. Split from `verify` so a lint failure does not cost the
  # time it takes to install browsers and run real diagnostics.
  e2e:
    runs-on: ubuntu-latest
    needs: verify

    # The official image pins the browsers *and* the font rendering, which is what
    # makes committed visual baselines reproducible. Baselines are Linux-only for
    # exactly this reason — see e2e/playwright.config.ts.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The API serves the built app, so there is nothing to test without this.
      - name: Build
        run: pnpm run build

      - name: End-to-end, accessibility and visual regression
        if: ${{ inputs.update_snapshots != true }}
        run: pnpm --filter @dwc/e2e run e2e
        env:
          CI: 'true'

      # Writes the baselines rather than comparing against them, then hands them
      # back to be committed. Playwright exits non-zero when it creates a
      # snapshot, which is correct for a normal run and not what we want here.
      - name: Regenerate visual baselines
        if: ${{ inputs.update_snapshots == true }}
        run: pnpm --filter @dwc/e2e exec playwright test specs/visual.spec.ts --update-snapshots || true
        env:
          CI: 'true'

      - name: Upload the regenerated baselines
        if: ${{ inputs.update_snapshots == true }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: e2e/specs/**/*.png
          retention-days: 7
          if-no-files-found: error

      - name: Upload traces, screenshots and visual diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v7

      - name: Verify the container builds
        run: docker build -t dwc/diagnostics:ci .

      # A container that builds but cannot answer is not a passing build.
      - name: Verify it starts and serves the app
        run: |
          docker run -d --name dwc -p 8787:8787 dwc/diagnostics:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/api/health
          # Same-origin serving of the built app is load-bearing for the latency
          # baseline, so assert the SPA is actually served rather than 404ing.
          curl -fsS http://127.0.0.1:8787/ | grep -q '<dwc-app>'
          docker rm -f dwc
